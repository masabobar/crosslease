services:
  # Development service - hot reload enabled
  app-dev:
    container_name: ${PROJECT_NAME:-refinext}_app_dev
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_APP_STAGE=${VITE_APP_STAGE:-local}
    command: pnpm run dev -- --host 0.0.0.0
    profiles:
      - dev

  # Production service - static build with nginx
  app-prod:
    container_name: ${PROJECT_NAME:-refinext}_app_prod
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        - VITE_APP_STAGE=${VITE_APP_STAGE:-production}
        - PROJECT_NAME=${PROJECT_NAME:-refinext}
        - VITE_API_URL=${VITE_API_URL}
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    profiles:
      - prod
